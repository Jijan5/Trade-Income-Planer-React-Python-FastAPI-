# =============================================================================
# Trade Income Planner — Docker Compose
# =============================================================================
# All sensitive values are read from your .env file.
# Copy .env.example to .env and fill in your own values before running.
#
# QUICK START:
#   docker-compose up --build
#
# RUN TESTS ONLY:
#   docker-compose --profile test up test
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - MYSQL_SERVER=db
      - WEB_CONCURRENCY=8
      - RATE_LIMIT_REQUESTS=300
      - RATE_LIMIT_WINDOW=60
      - DB_POOL_SIZE=50
      - DB_MAX_OVERFLOW=100
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Database — MySQL
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=500
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
      --table_open_cache=4000
      --thread_cache_size=50
      --wait_timeout=600
      --interactive_timeout=600
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    # NOTE: Port 3306 is intentionally NOT exposed to the host in production.
    # The backend container reaches the db container via the internal
    # app-network. Only expose this port if you need direct local DB access
    # during development by uncommenting the lines below:
    # ports:
    #   - "3306:3306"

  # ---------------------------------------------------------------------------
  # Test runner (only runs when --profile test is used)
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "/app/entrypoint.sh", "test"]
    env_file:
      - .env
    volumes:
      - ./coverage_html:/app/coverage_html
    networks:
      - app-network
    profiles:
      - test

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
